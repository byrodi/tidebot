<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8f9" />
    <title>Tidebot: program a fishing boat</title>
    <meta
      name="description"
      content="A programming game. Write a script, the boat follows it, the catch pays for upgrades."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body class="fd-theme">
    <svg class="sprites" aria-hidden="true">
      <symbol id="icon-sardine" viewBox="0 0 24 24">
        <path d="M3 8c1.9-2.6 5.3-3.2 7.9-1.4l2.9-1.7v6.2l-2.9-1.7C8.3 11.2 4.9 10.6 3 8z" />
        <path d="M9.5 16c1.9-2.6 5.3-3.2 7.9-1.4l2.9-1.7v6.2l-2.9-1.7c-2.6 1.8-6 1.2-7.9-1.4z" />
        <path d="M5.7 7.6v.1M12.2 15.6v.1" />
      </symbol>
      <symbol id="icon-crab" viewBox="0 0 24 24">
        <ellipse cx="12" cy="14.5" rx="6" ry="4.2" />
        <path
          d="M7 11.4 5 9M17 11.4 19 9M6.3 16.2 3.5 17.5M17.7 16.2l2.8 1.3M8 18.2l-1.5 2M16 18.2l1.5 2"
        />
        <circle cx="4.5" cy="7" r="2" />
        <circle cx="19.5" cy="7" r="2" />
      </symbol>
      <symbol id="icon-tuna" viewBox="0 0 24 24">
        <path
          d="M2 12c2.5-4 7.5-5.5 11.5-4 2 .8 3.6 2.2 4.5 4-.9 1.8-2.5 3.2-4.5 4-4 1.5-9 0-11.5-4z"
          fill="currentColor"
          fill-opacity="0.22"
        />
        <path d="M22 7.5 18 12l4 4.5M10 7.3l2-3.3 1.6 3.6M10.6 16.8l1.6 2.7 1.2-3.1" />
        <path d="M8 9.6c.8 1.5.8 3.3 0 4.8M5.6 11.2v.1" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="m5 12.5 4.5 4.5L19 7.5" />
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 7.5V12l3 2" />
      </symbol>
      <symbol id="icon-lock" viewBox="0 0 24 24">
        <rect x="5.5" y="10.5" width="13" height="9.5" rx="2.5" />
        <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" />
      </symbol>
    </svg>

    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <path
            d="M4 18h24l-3.5 8h-17z"
            fill="#ffffff"
            stroke="#29242a"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path
            d="M15.5 15V5l8 10z"
            fill="#e47f93"
            stroke="#29242a"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
        <h1>tidebot<span>.</span></h1>
        <p>Write the script. The boat does the fishing.</p>
      </div>
      <div class="stock" id="stock" aria-label="Stock"></div>
      <div class="clock" title="Time played"><span id="clock">0:00</span></div>
    </header>

    <main class="layout">
      <section class="panel script" aria-label="Script">
        <div class="panel-head">
          <h2>Script</h2>
          <span class="status" id="status" data-status="idle">Ready</span>
          <button class="button run" id="run" type="button" title="Run the script (Ctrl+Enter)">
            Run
          </button>
          <button class="button" id="stop" type="button">Stop</button>
        </div>
        <div class="editor" id="editor"></div>
        <div class="console" id="console" role="log" aria-label="Console"></div>
      </section>

      <section class="panel sea" aria-label="Sea">
        <div class="sea-frame">
          <canvas id="sea"></canvas>
        </div>
        <div class="hud">
          <div class="field">
            <span class="field-name">Cargo</span>
            <span class="meter"><i id="cargo-fill"></i></span>
            <b id="cargo">0 / 6</b>
          </div>
          <div class="field">
            <span class="field-name">Position</span>
            <b id="position">0, 0</b>
          </div>
          <div class="field" id="pots-field" hidden>
            <span class="field-name">Pots</span>
            <b id="pots">0 / 0</b>
          </div>
          <div class="field compass" title="north is up, east is right">
            <span class="field-name">North</span>
            <b>&uarr;</b>
          </div>
        </div>
        <p class="tip" id="tip" role="status"></p>
      </section>

      <section class="panel side" aria-label="Workshop and guide">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="workshop" aria-selected="true">
            Workshop <span class="badge" id="workshop-count"></span>
          </button>
          <button type="button" role="tab" data-tab="guide" aria-selected="false">Guide</button>
        </div>
        <div class="scroll" id="workshop"></div>
        <div class="scroll" id="guide" hidden></div>
        <div class="side-foot">
          <span class="credit">by rodi<span>.</span></span>
          <button class="reset" id="reset" type="button">Reset progress</button>
        </div>
      </section>
    </main>

    <dialog class="win" id="win">
      <h2>The lighthouse is lit</h2>
      <p>
        Every boat on this coast can find its way home now. You built it in
        <b id="win-time">0:00</b>.
      </p>
      <button class="button run" id="win-close" type="button">Keep fishing</button>
    </dialog>
  </body>
</html>
